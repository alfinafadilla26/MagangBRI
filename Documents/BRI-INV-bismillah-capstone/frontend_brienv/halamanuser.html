<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRI INV - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* CSS Variables for easier color management */
        :root {
            --bri-inv-blue: #3A7DCD; /* Main blue color */
            --bri-inv-dark-blue: #2A6DBA; /* Darker blue for sidebar */
            --text-color-dark: #333;
            --text-color-light: #666;
            --white: #fff;
            --input-border: #ccc;
            --input-focus-border: #888;
            --bg-light-gray: #f8f8f8; /* Page background */
            --box-shadow-light: rgba(0, 0, 0, 0.1);
            --sidebar-width: 250px;
            --category-active-bg: #3A7DCD; /* PERUBAHAN: Warna aktif kategori */
            --category-active-text: #fff;
            --category-bg: #E9ECEF;
            --category-text: #495057;
            --border-color: #dee2e6;
            --status-barang-keluar: #FFEBEE;
            --status-barang-keluar-border: #EF5350;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background-color: var(--bg-light-gray);
            color: var(--text-color-dark);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Sidebar Styling --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bri-inv-dark-blue);
            color: var(--white);
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
            transform: translateX(0);
        }

        .sidebar.hidden {
            transform: translateX(-100%);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            font-size: 1.4em;
            font-weight: 700;
            color: var(--white);
            text-decoration: none;
        }

        .sidebar-logo img {
            height: 35px;
            margin-right: 10px;
            filter: brightness(0) invert(1);
        }

        .sidebar h3 {
            font-size: 0.9em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
            margin-top: 0;
            letter-spacing: 0.5px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar ul li {
            margin-bottom: 10px;
        }

        .sidebar ul li a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: var(--white);
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease;
            cursor: pointer;
        }

        .sidebar ul li a i {
            margin-right: 15px;
            font-size: 1.2em;
        }

        .sidebar ul li a.active,
        .sidebar ul li a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* --- Main Content Styling --- */
        .main-content {
            flex-grow: 1;
            margin-left: var(--sidebar-width);
            padding: 30px;
            transition: margin-left 0.3s ease-in-out;
            background-color: var(--white); /* PERUBAHAN: Latar utama menjadi putih */
        }

        .main-content.expanded {
            margin-left: 0;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        /* PERUBAHAN: Penyesuaian search box */
        .top-bar .search-box {
            flex-grow: 1;
            max-width: 500px;
        }
        
        .top-bar .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
        }

        /* PERUBAHAN: Penyesuaian tombol login */
        .top-bar .login-button-top {
            background-color: var(--white);
            color: var(--text-color-dark);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px; /* Jarak antara ikon dan teks */
        }

        .top-bar .login-button-top:hover {
            background-color: #f1f1f1;
        }

        .hamburger { display: none; }

        /* --- Barang Page Specific Styling (BANYAK PERUBAHAN) --- */
        .barang-content .category-section h3,
        .barang-content .product-list-section h3 {
            font-size: 1.5em;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .barang-content .categories-grid {
            display: flex;
            flex-wrap: nowrap;
            gap: 15px;
            justify-content: flex-start;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }
        
        /* PERUBAHAN: Styling tombol kategori */
        .barang-content .category-item {
            flex-shrink: 0;
            padding: 8px 20px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 500;
            background-color: var(--category-bg);
            color: var(--category-text);
        }

        .barang-content .category-item.active {
            background-color: var(--category-active-bg);
            border-color: var(--category-active-bg);
            color: var(--category-active-text);
        }

        .barang-content .category-item:hover {
            border-color: var(--bri-inv-blue);
        }

        .barang-content .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); /* Sedikit lebih lebar */
            gap: 25px;
        }

        /* PERUBAHAN: Styling Kartu Produk */
        .barang-content .product-item {
            background-color: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .barang-content .product-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        }
        .product-details {
             flex-grow: 1;
        }
        .barang-content .product-name {
            font-weight: 600;
            margin: 0 0 5px 0;
            font-size: 1.05em;
            color: var(--text-color-dark);
        }

        .barang-content .product-description {
            font-size: 0.85em;
            color: var(--text-color-light);
            margin: 0 0 15px 0;
            min-height: 40px;
        }

        .product-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .quantity-input {
            width: 70px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
        }
        
        /* Hide arrows on number input */
        .quantity-input::-webkit-outer-spin-button,
        .quantity-input::-webkit-inner-spin-button {
          -webkit-appearance: none;
          margin: 0;
        }
        input[type=number] {
          -moz-appearance: textfield;
        }

        .take-button {
            background-color: var(--bri-inv-blue);
            color: var(--white);
            border: none;
            padding: 8px 25px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .take-button:hover {
            background-color: var(--bri-inv-dark-blue);
        }
        
        /* --- Pop-up Styling (Tidak banyak berubah) --- */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000;
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .popup-overlay.active { opacity: 1; visibility: visible; }
        .popup-content {
            background-color: var(--white);
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            width: 90%; max-width: 500px; padding: 30px;
            box-sizing: border-box; transform: translateY(20px);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .popup-overlay.active .popup-content { transform: translateY(0); opacity: 1; }
        .popup-content h2 { font-size: 2em; color: var(--text-color-dark); margin: 0 0 30px 0; font-weight: 700; }
        .popup-form-group { margin-bottom: 20px; }
        .popup-form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-color-light); }
        .popup-form-group input[type="text"], .popup-form-group input[type="number"] {
            width: 100%; padding: 12px 15px; border: 1px solid var(--input-border);
            border-radius: 8px; font-size: 1em; box-sizing: border-box;
            background-color: #f9f9f9;
        }
        .popup-status-selection {
            display: flex; align-items: center; padding: 15px;
            border: 1px solid var(--status-barang-keluar-border);
            border-radius: 8px; background-color: var(--status-barang-keluar);
            margin-top: 10px; color: var(--text-color-dark);
        }
        .popup-status-selection i { font-size: 1.8em; color: var(--status-barang-keluar-border); margin-right: 15px; }
        .popup-status-text strong { display: block; font-size: 1.1em; font-weight: 600; margin-bottom: 2px; }
        .popup-status-text span { font-size: 0.85em; color: var(--text-color-light); }
        .popup-buttons { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; }
        .popup-button { padding: 12px 25px; border: none; border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; transition: background-color 0.3s ease, transform 0.2s ease; }
        .popup-button.close { background-color: #f0f0f0; color: var(--text-color-dark); }
        .popup-button.close:hover { background-color: #e0e0e0; }
        .popup-button.submit { background-color: var(--bri-inv-blue); color: var(--white); box-shadow: 0 4px 15px rgba(58, 125, 205, 0.3); }
        .popup-button.submit:hover { background-color: var(--bri-inv-dark-blue); transform: translateY(-2px); }

        /* --- Sisa CSS (Dashboard & Responsive) tidak diubah --- */
        /* Anda bisa meletakkan sisa CSS dari file asli Anda di sini jika diperlukan */
        .dashboard-content { /* Styling dashboard tetap ada jika diperlukan */
            display: none; /* Sembunyikan dashboard sementara */
        }
        
    </style>
</head>
<body>
    <div class="app-container" style="display:flex; flex-grow: 1;">
        <div class="sidebar" id="sidebar">
            <a href="#" class="sidebar-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/BANK_BRI_logo.svg/2560px-BANK_BRI_logo.svg.png" alt="BRI INV Logo">
                <span>BRI INV</span>
            </a>
            <h3>Inventory</h3>
            <nav>
                <ul>
                    <li><a href="#" id="navDashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</a></li>
                    <li><a href="#" id="navBarang" class="active"><i class="fa-solid fa-box"></i> Barang</a></li>
                </ul>
            </nav>
        </div>

        <div class="main-content" id="main-content">
            <div class="top-bar">
                <div class="hamburger" id="hamburger-menu">
                    <i class="fas fa-bars"></i>
                </div>
                <div class="search-box" id="searchBox">
                    <input type="text" placeholder="Pencarian...">
                </div>
                <button class="login-button-top" id="loginBtn">
                    <i class="fas fa-user-circle"></i>
                    <span>MASUK</span>
                </button>
            </div>

            <div id="dashboardContent" class="dashboard-content">
                <h2>Halaman Dashboard</h2>
            </div>

            <div id="barangContent" class="barang-content">
                <div class="category-section">
                    <h3>Category</h3>
                    <div class="categories-grid">
                        </div>
                </div>

                <div class="product-list-section">
                    <h3 id="product-list-title">Semua Barang</h3>
                    <div class="products-grid">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <div id="statusPopup" class="popup-overlay">
        <div class="popup-content">
            <h2>Ambil Barang</h2> <div class="popup-form-group">
                <label for="popupNamaBarang">Nama Barang</label>
                <input type="text" id="popupNamaBarang" readonly>
            </div>
            <div class="popup-form-group">
                <label for="popupJumlah">Jumlah yang Diambil</label>
                <input type="number" id="popupJumlah" readonly>
            </div>
            <div class="popup-form-group">
                <label for="popupNamaPengguna">Nama Pengambil</label>
                <input type="text" id="popupNamaPengguna" placeholder="Masukkan nama Anda">
            </div>
            <div class="popup-buttons">
                <button class="popup-button close" id="closePopupBtn">Batal</button>
                <button class="popup-button submit">Kirim</button>
            </div>
        </div>
    </div>

<script>
    // --- KONFIGURASI DAN ELEMEN ---
    const API_BASE = 'http://localhost:5000/api';
    const navDashboard = document.getElementById('navDashboard');
    const navBarang = document.getElementById('navBarang');
    const searchInput = document.querySelector('#searchBox input');
    const dashboardContent = document.getElementById('dashboardContent');
    const barangContent = document.getElementById('barangContent');
    const categoriesGrid = document.querySelector('.categories-grid');
    const productsGrid = document.querySelector('.products-grid');
    const productListTitle = document.getElementById('product-list-title');
    const statusPopup = document.getElementById('statusPopup');
    const closePopupBtn = document.getElementById('closePopupBtn');
    const popupNamaBarang = document.getElementById('popupNamaBarang');
    const popupJumlah = document.getElementById('popupJumlah');
    const popupNamaPengguna = document.getElementById('popupNamaPengguna');

    let allCategories = [];
    let allItems = [];
    let selectedCategory = null;
    let itemToProcess = null; // Menyimpan item yang akan diproses

    // --- FUNGSI PENGAMBILAN DATA ---
    async function fetchData() {
        showLoading();
        try {
            const [catRes, itemRes] = await Promise.all([
                fetch(`${API_BASE}/categories`),
                fetch(`${API_BASE}/items`)
            ]);
            const catData = await catRes.json();
            const itemData = await itemRes.json();

            if (catData.success) {
                allCategories = catData.categories;
                renderCategories();
            } else {
                handleFetchError(categoriesGrid, 'kategori');
            }

            if (itemData.success) {
                allItems = itemData.items;
                renderProducts();
            } else {
                handleFetchError(productsGrid, 'barang');
            }

        } catch (e) {
            handleFetchError(categoriesGrid, 'kategori');
            handleFetchError(productsGrid, 'barang');
        }
    }

    // --- FUNGSI RENDER TAMPILAN ---

    function renderCategories() {
        categoriesGrid.innerHTML = ''; // Kosongkan dulu
        // Tambahkan tombol "Semua"
        const allCatDiv = document.createElement('div');
        allCatDiv.className = 'category-item active';
        allCatDiv.textContent = 'Semua';
        allCatDiv.addEventListener('click', function() {
            setActiveCategory(this);
            selectedCategory = null;
            renderProducts();
        });
        categoriesGrid.appendChild(allCatDiv);

        allCategories.forEach(cat => {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.dataset.categoryId = cat[0];
            // PERUBAHAN: Hanya menampilkan nama kategori
            div.textContent = cat[1];
            
            div.addEventListener('click', function() {
                setActiveCategory(this);
                selectedCategory = cat[0];
                renderProducts();
            });
            categoriesGrid.appendChild(div);
        });
    }

    // PERUBAHAN BESAR: Fungsi render produk disesuaikan dengan desain baru
    function renderProducts() {
        const query = searchInput.value.toLowerCase();
        let filteredItems = allItems;

        // Filter berdasarkan kategori
        if (selectedCategory) {
            const categoryName = getCategoryName(selectedCategory);
            filteredItems = allItems.filter(item => item[2] === categoryName);
            productListTitle.textContent = categoryName;
        } else {
            productListTitle.textContent = "Semua Barang";
        }
        
        // Filter berdasarkan pencarian
        if (query) {
            filteredItems = filteredItems.filter(item => item[1].toLowerCase().includes(query));
        }

        productsGrid.innerHTML = '';
        if (!filteredItems.length) {
            productsGrid.innerHTML = '<div>Barang tidak ditemukan.</div>';
            return;
        }

        filteredItems.forEach(item => {
            // item: [item_id, item_name, category_name, stock, description]
            const div = document.createElement('div');
            div.className = 'product-item';
            div.dataset.itemId = item[0];
            
            div.innerHTML = `
                <div class="product-details">
                    <p class="product-name">${item[1]}</p>
                    <p class="product-description">${item[4] || 'Tidak ada deskripsi'}</p>
                </div>
                <div class="product-actions">
                    <input type="number" class="quantity-input" value="1" min="1" max="${item[3]}">
                    <button class="take-button">Ambil</button>
                </div>
            `;

            // Tambah event listener untuk tombol "Ambil"
            const takeButton = div.querySelector('.take-button');
            const quantityInput = div.querySelector('.quantity-input');

            takeButton.addEventListener('click', (e) => {
                e.stopPropagation(); // Mencegah event lain terpicu
                const quantity = parseInt(quantityInput.value, 10);
                
                if (quantity > item[3]) {
                    alert(`Stok tidak mencukupi! Stok tersisa: ${item[3]}`);
                    quantityInput.value = item[3];
                    return;
                }

                if (quantity > 0) {
                    itemToProcess = item; // Simpan data item yang dipilih
                    // Buka popup untuk konfirmasi
                    popupNamaBarang.value = item[1];
                    popupJumlah.value = quantity;
                    popupNamaPengguna.value = ''; // Kosongkan nama pengambil
                    statusPopup.classList.add('active');
                    popupNamaPengguna.focus();
                } else {
                    alert('Jumlah harus lebih dari 0.');
                }
            });
            
            productsGrid.appendChild(div);
        });
    }

    // --- FUNGSI LOGIKA APLIKASI ---

    async function submitTakeItem() {
        if (!itemToProcess) return;

        const quantity = parseInt(popupJumlah.value);
        const takerName = popupNamaPengguna.value.trim();
        const itemId = itemToProcess[0];

        if (!takerName) {
            alert('Nama pengambil wajib diisi!');
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/items/${itemId}/take`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ quantity: quantity, taker_name: takerName })
            });
            const data = await res.json();
            if (data.success) {
                alert('Berhasil mengambil barang!');
                statusPopup.classList.remove('active');
                fetchData(); // Muat ulang semua data untuk update stok
            } else {
                alert(data.message || 'Gagal mengambil barang!');
            }
        } catch (e) {
            alert('Terjadi kesalahan saat menghubungi server.');
        }
    }

    // --- FUNGSI BANTU & UI ---

    function setActiveCategory(activeElement) {
        document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
        activeElement.classList.add('active');
    }

    function getCategoryName(catId) {
        const found = allCategories.find(cat => cat[0] == catId);
        return found ? found[1] : '';
    }
    
    function showLoading() {
        categoriesGrid.innerHTML = '<div>Memuat kategori...</div>';
        productsGrid.innerHTML = '<div>Memuat barang...</div>';
    }

    function handleFetchError(element, type) {
        element.innerHTML = `<div>Gagal memuat ${type}. Cek koneksi ke server.</div>`;
    }
    
   function showContentPage(pageId, clickedLink = null) {
    // PENAMBAHAN: Cek apakah link yang diklik sudah aktif.
    if (clickedLink && clickedLink.classList.contains('active')) {
        return; // Jika sudah aktif, jangan lakukan apa-apa dan hentikan fungsi.
    }

    // Sembunyikan semua halaman konten
    document.getElementById('dashboardContent').style.display = 'none';
    document.getElementById('barangContent').style.display = 'none';

    // Tampilkan halaman yang dipilih
    document.getElementById(pageId).style.display = 'block';

    // Atur status aktif pada navigasi
    navDashboard.classList.toggle('active', pageId === 'dashboardContent');
    navBarang.classList.toggle('active', pageId === 'barangContent');
}
    // --- EVENT LISTENERS ---
    
    // Pencarian
    searchInput.addEventListener('input', renderProducts);
    
    // Navigasi
    navDashboard.addEventListener('click', (e) => { e.preventDefault(); showContentPage('dashboardContent'); });
    navBarang.addEventListener('click', (e) => { e.preventDefault(); showContentPage('barangContent'); });
    
    // Pop-up
    closePopupBtn.addEventListener('click', () => statusPopup.classList.remove('active'));
    statusPopup.querySelector('.popup-button.submit').addEventListener('click', submitTakeItem);
    statusPopup.addEventListener('click', (event) => {
        if (event.target === statusPopup) {
            statusPopup.classList.remove('active');
        }
    });

    // Inisialisasi Aplikasi
    document.addEventListener('DOMContentLoaded', () => {
        showContentPage('barangContent'); // Langsung tampilkan halaman barang sesuai permintaan
        fetchData();
    });

</script>
</body>
</html>
